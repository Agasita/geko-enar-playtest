<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f2a44">
<title>ゲコ＆エナー v2 — 世界を直して進め</title>
<script>document.write('<link rel="stylesheet" href="style.css?t='+Date.now()+'">')</script>
<noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
<div id="stage">
  <div id="game">
    <canvas id="cv" width="320" height="180"></canvas>

    <div id="hud" class="hide">
      <span id="lvname"></span>
      <div class="hudbtns">
        <button id="btn-edit" aria-label="編集">編集 <kbd>E</kbd></button>
        <button id="btn-restart" aria-label="やりなおし">↻</button>
        <button id="btn-mute" aria-label="音">🔊</button>
        <button id="btn-menu" aria-label="ステージえらび">☰</button>
      </div>
    </div>
    <div id="toast" class="hide"></div>

    <div id="touch" class="hide">
      <div class="pad">
        <button data-btn="left" aria-label="左">◀</button>
        <button data-btn="right" aria-label="右">▶</button>
        <button data-btn="down" class="small" aria-label="下">▼</button>
      </div>
      <div class="acts">
        <button data-btn="dash" class="b-dash">ダッシュ</button>
        <button data-btn="attack" class="b-atk">攻撃</button>
        <button data-btn="jump" class="b-jump">ジャンプ</button>
      </div>
    </div>

    <div id="editbar" class="hide">
      <div id="edithelp"></div>
      <div id="tabs"></div>
      <div id="tools"></div>
      <div id="opts"></div>
      <div id="editfoot">
        <button id="e-undo" aria-label="元に戻す">↶</button>
        <button id="e-redo" aria-label="やり直し">↷</button>
        <button id="e-pan" aria-label="画面を動かす">✋</button>
        <button id="e-done" class="done">編集を終える</button>
      </div>
    </div>

    <section id="screen-title" class="screen">
      <h1>ゲコ<span>＆</span>エナー</h1>
      <p class="sub">時間を止めて、世界を直しながら進む<br>アクション・パズル</p>
      <button id="btn-play" class="big">あそぶ</button>
      <button id="btn-guide" class="ghost">ブロックのずかん</button>
      <p class="keys">PC: ← → 移動　Z/Space ジャンプ　X 攻撃　C ダッシュ　E 編集（時間停止）<br>編集中: ドラッグで範囲を選ぶ／1〜9 道具　[ ] タブ　Z 戻す　Y やり直し　R やりなおし</p>
      <p class="themes"><a class="oldlink" href="./">Excel風（標準）</a>　<a class="oldlink" href="?gfx=snes">ソリッド版</a>　<a class="oldlink" href="?gfx=classic">元の絵</a></p><a class="oldlink" href="../">旧バージョン（Pyxel版）はこちら</a>
    </section>

    <section id="screen-select" class="screen hide">
      <header><button id="btn-back" class="ghost">◀ もどる</button><h2>ステージえらび</h2><button id="btn-guide2" class="ghost">ずかん</button><span id="total"></span></header>
      <div id="levels"></div>
      <footer><button id="btn-editor" class="ghost tiny">ステージ作成（テスト用）</button> <button id="btn-reset" class="ghost tiny">セーブを消す</button></footer>
    </section>

    <section id="screen-guide" class="screen hide">
      <header><button id="btn-guide-back" class="ghost">◀ もどる</button><h2>ブロックのずかん</h2></header>
      <div id="guide"></div>
    </section>

    <section id="screen-result" class="screen hide">
      <h2>クリア！</h2>
      <div id="r-stars"></div>
      <p id="r-info"></p>
      <p id="r-tip"></p>
      <div class="row"><button id="r-next" class="big">次のステージへ</button></div>
      <div class="row"><button id="r-retry" class="ghost">もう一度</button><button id="r-menu" class="ghost">ステージえらび</button></div>
    </section>
  </div>
</div>
<script>
// 毎回あたらしいファイルを読み込む（スマホで古いキャッシュが残らないように）。順番どおりに実行される。
(function () { var t = Date.now(); ['sprites.js', 'levels.js', 'gfx_snes.js', 'gfx_excel.js', 'game.js'].forEach(function (f) { document.write('<script src="' + f + '?t=' + t + '"><\/script>'); }); })();
</script>
</body>
</html>
