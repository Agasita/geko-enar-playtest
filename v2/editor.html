<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ステージ作成 ゲコ＆エナー v2</title>
<style>
:root{--bg:#1f2a44;--panel:#2e3b5e;--panel2:#3a4a75;--ink:#fff;--muted:#aeb8d0;--accent:#f5c842;--green:#58b368}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Yu Gothic","Hiragino Sans",sans-serif}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#17203a;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:10px;background:var(--panel);padding:6px 12px;cursor:pointer;min-height:34px}
button:active,button.sel{background:var(--accent);color:var(--bg)}
button.modebtn{font-weight:700;min-width:150px}
button.go{background:var(--green);font-weight:700}
input[type=text],input[type=number],select,textarea{background:#17203a;border:1px solid #ffffff30;border-radius:8px;padding:5px 8px;max-width:100%}
main{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{color:var(--muted);font-size:12px;margin-right:2px}
.pal button{min-width:44px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
#wrap{overflow:auto;border:1px solid #ffffff30;border-radius:8px;background:#000;max-width:100%}
canvas{display:block;image-rendering:pixelated}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 8px}
.tools label{font-size:13px}
details{background:#ffffff0c;border-radius:10px;padding:6px 10px}
summary{cursor:pointer;color:var(--accent)}
textarea{width:100%;height:110px;font-size:11px}
#msg{color:var(--accent);min-height:1.4em}
a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>ステージ作成</h1>
  <button id="b-save">保存</button>
  <button id="b-test" class="go">▶ テストプレイ</button>
  <button id="b-new">新規</button>
  <a href="index.html">ゲームにもどる</a>
</header>
<main>
  <div class="row"><span class="lbl">名前</span><input id="f-name" type="text" value="マイステージ" size="16">
    <span class="lbl">はば</span><input id="f-w" type="number" min="20" max="160" value="60" style="width:70px">
    <span class="lbl">たかさ</span><input id="f-h" type="number" min="12" max="60" value="12" style="width:70px">
    <button id="b-w">はば・たかさを変える</button>
    <span class="lbl">コスト上限</span><input id="f-energy" type="number" min="0" max="100" value="20" style="width:70px"></div>
  <div class="row"><span class="lbl">ヒント(スタートで表示)</span><input id="f-hint" type="text" size="40" placeholder="（なくてもOK）"></div>

  <div class="row"><button id="b-mode" class="modebtn"></button><span class="lbl">「動かす」のあいだは、さわってもブロックは置かれません。道具をえらぶと「置く」になります</span></div>
  <div class="row pal" id="pal"></div>
  <div class="row pal" id="pal2"></div>
  <div class="row"><label><input type="checkbox" id="f-lock"> 保護（カギつき）にする</label>
    <button id="b-floor">ゆか（下2行）をはる</button><span class="lbl" id="cursor"></span></div>

  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="msg"></div>

  <details open><summary>使える道具（このステージで解放するもの）</summary><div class="tools" id="tools"></div></details>

  <details><summary>保存したステージ ／ 既存ステージから読みこむ</summary>
    <div class="row" style="margin-top:6px"><select id="s-saved"></select><button id="b-load">読みこむ</button><button id="b-del">削除</button></div>
    <div class="row" style="margin-top:6px"><select id="s-base"></select><button id="b-base">ひな形にする</button></div>
  </details>

  <details><summary>書き出し ／ 読み込み（ほかの人に渡す・バックアップ）</summary>
    <div class="row" style="margin:6px 0"><button id="b-exp">書き出す</button><button id="b-imp">この内容を読み込む</button></div>
    <textarea id="t-json" placeholder="ここにステージのデータ（JSON）が出ます。貼りつけて「読み込む」もできます"></textarea>
  </details>
</main>
<script src="levels.js"></script>
<script>
(function () {
  'use strict';
  let H = 12;
  const T = 20, KEY = 'geko-enar-v2-custom';
  const COLORS = [['茶', '#C9A15E'], ['赤', '#E8563F'], ['青', '#6FD6E8'], ['緑', '#58B368'], ['黄', '#F5C842'], ['ガラス', '#DCEBF3']];
  const TOOLS = [['painter', '書式のコピー'], ['transform', '変形'], ['sort', '並べ替え（寄せる）'], ['filter', 'フィルター'], ['protect', 'シートの保護'], ['unprotect', '保護の解除']];
  const ENTS = [['walker', 'ノイズ', '#B04F5A'], ['guard', 'ガード', '#4C9BE8'], ['flyer', 'フライヤー', '#9B6FD0'], ['turret', 'タレット', '#7A7F95']];
  const $ = (s) => document.querySelector(s);
  const cv = $('#cv'), ctx = cv.getContext('2d');
  let L = null, cur = { kind: 'block', color: 0 }, editingId = null, down = false, last = null;
  let mode = (window.matchMedia && matchMedia('(pointer:coarse)').matches) ? 'scroll' : 'draw'; // スマホは、まず「動かす」(うっかり置かない)
  function setMode(m) { mode = m; cv.style.touchAction = m === 'scroll' ? 'auto' : 'none'; const b = $('#b-mode'); b.textContent = m === 'scroll' ? '✋ いま：動かす（タップで切りかえ）' : '✏ いま：置く（タップで切りかえ）'; b.classList.toggle('sel', m === 'draw'); }

  function blank(w, h) {
    H = h || H;
    const front = [], color = [], lock = [];
    for (let y = 0; y < H; y++) { front.push(new Array(w).fill('.')); color.push(new Array(w).fill(0)); lock.push(new Array(w).fill(0)); }
    for (let y = H - 2; y < H; y++) front[y].fill('S');
    return { w, front, color, lock, ents: [], gems: [], checks: [], start: [2, H - 3], flag: [w - 4, H - 3] };
  }
  function fromLevel(lv) { // 既存ステージ → 編集用(文字の2次元配列)
    H = lv.front.length;
    return { w: lv.w, front: lv.front.map(r => Array.from(r)), color: lv.color.map(r => r.slice()), lock: lv.lock.map(r => r.slice()), ents: lv.ents.map(e => ({ type: e.type, x: e.x, y: e.y })), gems: lv.gems.map(g => g.slice()), checks: lv.checks.map(c => c.slice()), start: lv.start.slice(), flag: lv.flag.slice() };
  }
  function resize(w, h) {
    w = Math.max(20, Math.min(160, w | 0)); h = Math.max(12, Math.min(60, h | 0)); const oldH = L.front.length, dy = h - oldH;
    const n = blank(w, h);
    for (let y = 0; y < oldH; y++) { const ny = y + dy; if (ny < 0) continue;
      for (let x = 0; x < Math.min(w, L.w); x++) { n.front[ny][x] = L.front[y][x]; n.color[ny][x] = L.color[y][x]; n.lock[ny][x] = L.lock[y][x]; } }
    if (false) for (let y = 0; y < H; y++) for (let x = 0; x < Math.min(w, L.w); x++) { n.front[y][x] = L.front[y][x]; n.color[y][x] = L.color[y][x]; n.lock[y][x] = L.lock[y][x]; }
    n.ents = L.ents.filter(e => e.x < w && e.y + dy >= 0).map(e => ({ type: e.type, x: e.x, y: e.y + dy })); n.gems = L.gems.filter(g => g[0] < w && g[1] + dy >= 0).map(g => [g[0], g[1] + dy]); n.checks = L.checks.filter(c => c[0] < w && c[1] + dy >= 0).map(c => [c[0], c[1] + dy]);
    n.start = L.start[0] < w && L.start[1] + dy >= 0 ? [L.start[0], L.start[1] + dy] : [2, h - 3]; n.flag = L.flag[0] < w && L.flag[1] + dy >= 1 ? [L.flag[0], L.flag[1] + dy] : [w - 4, h - 3];
    L = n; fit();
  }
  function fit() { cv.width = L.w * T; cv.height = H * T; draw(); }

  function draw() {
    ctx.fillStyle = '#42B8C2'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (let y = 0; y < H; y++) for (let x = 0; x < L.w; x++) {
      const c = L.front[y][x], px = x * T, py = y * T;
      if (c === '#') { ctx.fillStyle = COLORS[L.color[y][x]][1]; ctx.fillRect(px, py, T, T); ctx.fillStyle = '#0003'; ctx.fillRect(px, py + T - 3, T, 3); if (L.lock[y][x]) { ctx.fillStyle = '#1F2A44'; ctx.fillRect(px + T - 9, py + 2, 7, 8); ctx.fillStyle = '#F5C842'; ctx.fillRect(px + T - 8, py + 5, 5, 4); } }
      else if (c === 'S') { ctx.fillStyle = '#66708C'; ctx.fillRect(px, py, T, T); ctx.fillStyle = '#2F3752'; ctx.fillRect(px + 4, py + 8, 3, 3); ctx.fillRect(px + 13, py + 8, 3, 3); }
      else if (c === 'c') { ctx.fillStyle = '#C9A15E'; ctx.fillRect(px, py, T, T); ctx.fillStyle = '#735630'; ctx.fillRect(px + 9, py + 3, 3, 6); ctx.fillRect(px + 6, py + 8, 3, 6); ctx.fillRect(px + 12, py + 12, 3, 5); }
    }
    ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= L.w; x++) { ctx.moveTo(x * T + .5, 0); ctx.lineTo(x * T + .5, cv.height); if (x % 10 === 0) { } }
    for (let y = 0; y <= H; y++) { ctx.moveTo(0, y * T + .5); ctx.lineTo(cv.width, y * T + .5); }
    ctx.stroke();
    ctx.fillStyle = '#ffffff66'; ctx.font = '9px sans-serif'; for (let x = 0; x < L.w; x += 5) ctx.fillText(x, x * T + 2, 9);
    const glyph = (x, y, t, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x * T + T / 2, y * T + T / 2, 8, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t, x * T + T / 2, y * T + T / 2 + 4); ctx.textAlign = 'left'; };
    for (const e of L.ents) { const d = ENTS.find(q => q[0] === e.type); glyph(e.x, e.y, d[1][0], d[2]); }
    for (const g of L.gems) glyph(g[0], g[1], '◆', '#4C9BE8');
    for (const c of L.checks) glyph(c[0], c[1], '旗', '#8D97B3');
    glyph(L.start[0], L.start[1], 'ス', '#58B368');
    glyph(L.flag[0], L.flag[1], 'ゴ', '#E8563F'); glyph(L.flag[0], L.flag[1] - 1, 'ー', '#E8563F');
  }

  function cell(e) { const r = cv.getBoundingClientRect(), s = r.width / cv.width; return [Math.floor((e.clientX - r.left) / s / T), Math.floor((e.clientY - r.top) / s / T)]; }
  const inb = (x, y) => x >= 0 && y >= 0 && x < L.w && y < H;
  function eraseAt(x, y) {
    L.front[y][x] = '.'; L.color[y][x] = 0; L.lock[y][x] = 0;
    L.ents = L.ents.filter(e => !(e.x === x && e.y === y)); L.gems = L.gems.filter(g => !(g[0] === x && g[1] === y)); L.checks = L.checks.filter(c => !(c[0] === x && c[1] === y));
  }
  function apply(x, y) {
    if (!inb(x, y)) return;
    const k = cur.kind;
    if (k === 'erase') return eraseAt(x, y);
    if (k === 'block') { L.front[y][x] = '#'; L.color[y][x] = cur.color; L.lock[y][x] = $('#f-lock').checked ? 1 : 0; L.ents = L.ents.filter(e => !(e.x === x && e.y === y)); return; }
    if (k === 'steel') { eraseAt(x, y); L.front[y][x] = 'S'; return; }
    if (k === 'crack') { eraseAt(x, y); L.front[y][x] = 'c'; return; }
    if (k === 'ent') { if (L.front[y][x] !== '.') return; L.ents = L.ents.filter(e => !(e.x === x && e.y === y)); L.ents.push({ type: cur.type, x, y }); return; }
    if (k === 'gem') { if (L.front[y][x] !== '.') return; if (!L.gems.some(g => g[0] === x && g[1] === y)) L.gems.push([x, y]); return; }
    if (k === 'check') { if (L.front[y][x] !== '.') return; if (!L.checks.some(c => c[0] === x && c[1] === y)) L.checks.push([x, y]); return; }
    if (k === 'start') { L.start = [x, y]; return; }
    if (k === 'flag') { L.flag = [x, y]; return; }
  }
  function line(a, b) { // ドラッグが速くても、とびとびにならないように
    let [x0, y0] = a; const [x1, y1] = b, dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx - dy;
    for (;;) { apply(x0, y0); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 > -dy) { err -= dy; x0 += sx; } if (e2 < dx) { err += dx; y0 += sy; } }
  }
  cv.addEventListener('pointerdown', (e) => { if (mode !== 'draw') return; e.preventDefault(); cv.setPointerCapture(e.pointerId); down = true; last = cell(e); apply(last[0], last[1]); draw(); });
  cv.addEventListener('pointermove', (e) => { const c = cell(e); $('#cursor').textContent = inb(c[0], c[1]) ? '(' + c[0] + ', ' + c[1] + ')' : ''; if (!down) return; if (!last || c[0] !== last[0] || c[1] !== last[1]) { if (cur.kind === 'start' || cur.kind === 'flag') apply(c[0], c[1]); else line(last || c, c); last = c; draw(); } });
  const up = () => { down = false; last = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  // ---- パレット ----
  function setCur(btn, v) { document.querySelectorAll('.pal button').forEach(b => b.classList.remove('sel')); btn.classList.add('sel'); cur = v; setMode('draw'); }
  function addBtn(box, html, v) { const b = document.createElement('button'); b.innerHTML = html; b.onclick = () => setCur(b, v); box.appendChild(b); return b; }
  (function () {
    const p = $('#pal'), p2 = $('#pal2');
    COLORS.forEach((c, i) => { const b = addBtn(p, '<span class="sw" style="background:' + c[1] + '"></span>' + c[0] + 'ブロック', { kind: 'block', color: i }); if (i === 0) b.classList.add('sel'); });
    addBtn(p, '鋼（固定）', { kind: 'steel' }); addBtn(p, 'ひび割れ壁', { kind: 'crack' }); addBtn(p, '消しゴム', { kind: 'erase' });
    ENTS.forEach(e => addBtn(p2, '<span class="sw" style="background:' + e[2] + ';border-radius:50%"></span>' + e[1], { kind: 'ent', type: e[0] }));
    addBtn(p2, '宝石', { kind: 'gem' }); addBtn(p2, 'チェックポイント', { kind: 'check' }); addBtn(p2, 'スタート', { kind: 'start' }); addBtn(p2, 'ゴール', { kind: 'flag' });
    TOOLS.forEach(t => { const l = document.createElement('label'); l.innerHTML = '<input type="checkbox" data-t="' + t[0] + '"> ' + t[1]; $('#tools').appendChild(l); });
  })();

  // ---- 保存・読みこみ ----
  function readAll() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
  function writeAll(a) { localStorage.setItem(KEY, JSON.stringify(a)); }
  function toData() {
    return { id: editingId || nextId(), name: $('#f-name').value.trim() || 'マイステージ', w: L.w, tools: [...document.querySelectorAll('#tools input:checked')].map(i => i.dataset.t), energy: Math.max(0, Math.min(100, $('#f-energy').value | 0)),
      hint: $('#f-hint').value.trim(), front: L.front.map(r => r.join('')), color: L.color.map(r => r.slice()), lock: L.lock.map(r => r.slice()), ents: L.ents.map(e => ({ type: e.type, x: e.x, y: e.y })), gems: L.gems.map(g => g.slice()), checks: L.checks.map(c => c.slice()), start: L.start.slice(), flag: L.flag.slice() };
  }
  function nextId() { const used = new Set(readAll().map(l => l.id)); let n = 1; while (used.has('MY-' + n)) n++; return 'MY-' + n; }
  function msg(t) { $('#msg').textContent = t; }
  function check(d) {
    if (L.front[d.start[1] + 1] && L.front[d.start[1] + 1][d.start[0]] === '.') return 'スタートの足もとに、地面がありません';
    if (d.flag[1] + 1 < H && L.front[d.flag[1] + 1][d.flag[0]] === '.') return 'ゴールの足もとに、地面がありません';
    return '';
  }
  function save() {
    const d = toData(); const warn = check(d); const all = readAll(); const i = all.findIndex(l => l.id === d.id);
    if (i >= 0) all[i] = d; else all.push(d);
    try { writeAll(all); } catch (e) { msg('保存できませんでした（ブラウザの保存領域がいっぱい？）'); return null; }
    editingId = d.id; refreshSaved(); msg('保存しました（' + d.id + '）' + (warn ? ' ※' + warn : '')); return d;
  }
  function loadData(d) {
    L = fromLevel(d); editingId = d.id || null; $('#f-name').value = d.name || 'マイステージ'; $('#f-w').value = L.w; $('#f-h').value = H; $('#f-energy').value = d.energy | 0; $('#f-hint').value = d.hint || (d.hints && d.hints[0] ? d.hints[0].text : '');
    document.querySelectorAll('#tools input').forEach(i => { i.checked = (d.tools || []).includes(i.dataset.t); }); fit();
  }
  function refreshSaved() {
    const s = $('#s-saved'); s.innerHTML = ''; readAll().forEach(l => { const o = document.createElement('option'); o.value = l.id; o.textContent = l.id + ' ' + l.name; s.appendChild(o); });
    if (editingId) s.value = editingId;
  }
  $('#b-save').onclick = save;
  $('#b-test').onclick = () => { const d = save(); if (d) location.href = 'index.html?test=' + encodeURIComponent(d.id); };
  $('#b-new').onclick = () => { if (!confirm('新しいステージを作ります（保存していない内容は消えます）')) return; editingId = null; loadData(Object.assign(blank(60), { name: 'マイステージ', tools: [], energy: 20 })); editingId = null; msg(''); };
  $('#b-w').onclick = () => { resize($('#f-w').value, $('#f-h').value); $('#f-w').value = L.w; $('#f-h').value = H; };
  $('#b-floor').onclick = () => { for (let y = H - 2; y < H; y++) for (let x = 0; x < L.w; x++) { L.front[y][x] = 'S'; L.color[y][x] = 0; L.lock[y][x] = 0; } draw(); };
  $('#b-load').onclick = () => { const l = readAll().find(q => q.id === $('#s-saved').value); if (l) { loadData(l); msg('読みこみました'); } };
  $('#b-del').onclick = () => { const id = $('#s-saved').value; if (!id || !confirm(id + ' を削除しますか？')) return; writeAll(readAll().filter(l => l.id !== id)); if (editingId === id) editingId = null; refreshSaved(); msg('削除しました'); };
  $('#b-base').onclick = () => { const lv = window.LEVELS[+$('#s-base').value]; if (!lv || !confirm(lv.id + ' をひな形にします（いまの内容は消えます）')) return; editingId = null; loadData(Object.assign({}, lv, { id: null, name: lv.name + 'のコピー' })); editingId = null; msg('ひな形を読みこみました。保存すると新しいステージになります'); };
  $('#b-exp').onclick = () => { $('#t-json').value = JSON.stringify(toData()); $('#t-json').select(); msg('書き出しました。コピーして渡せます'); };
  $('#b-imp').onclick = () => { try { const d = JSON.parse($('#t-json').value); if (!d || !Array.isArray(d.front) || d.front.length < 12 || d.front.length > 60) throw 0; d.id = null; loadData(d); editingId = null; msg('読みこみました。保存すると新しいステージになります'); } catch (e) { msg('読みこめませんでした（データが正しくありません）'); } };

  (window.LEVELS || []).forEach((l, i) => { const o = document.createElement('option'); o.value = i; o.textContent = l.id + ' ' + l.name; $('#s-base').appendChild(o); });
  $('#b-mode').onclick = () => setMode(mode === 'draw' ? 'scroll' : 'draw');
  loadData(Object.assign(blank(60), { name: 'マイステージ', tools: ['sort'], energy: 20 })); editingId = null; refreshSaved(); setMode(mode);
  window.__editor = { get L() { return L; }, apply, toData, save, loadData, draw };
})();
</script>
</body>
</html>
